# Local GPU-worker override (node-a only, NOT committed):
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d worker-gpu
# Purpose: give ONE coder worker access to the idle gpu-b (PCI 07:00.0,
# card1/renderD129) while the gpu-a (card0) stays reserved for the bench.
# The container sees only card1 — no pinning env needed.
services:
  worker-gpu:
    <<: *mesh-service
    command: ["python", "-m", "memnc.worker"]
    environment:
      <<: *mesh-env
      ROLE: coder
      NODE_NAME: ${NODE_NAME:-node-a}-gpu
      NATS_NKEYS_SEED: /secrets/${NODE_NAME:-node-a}-gpu.nk
      MODEL_CODER: ${MODEL_CODER:-qwen2.5-coder:32b}
      # advertise the real GPU to the roster (T6)
      NODE_GPU: "gpu-b"
      NODE_VRAM_GB: "16"
    devices:
      - /dev/kfd
      - /dev/dri/card1
      - /dev/dri/renderD129
    group_add:
      - "44"    # video
      - "993"   # render
    depends_on:
      nats:
        condition: service_healthy
    mem_limit: 8g
    cpus: 4.0
    pids_limit: 512
